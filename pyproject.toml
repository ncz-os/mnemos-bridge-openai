[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mnemos-bridge-openai"
version = "0.1.1"
description = "OpenAI Python SDK adapter for the MNEMOS bridge abstraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MNEMOS OS" }]
dependencies = [
    "mnemos-bridge-core>=0.1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.uv.sources]
mnemos-bridge-core = { git = "https://gitlab.com/mnemos-os/mnemos-bridge-core" }

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos_bridge_openai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live tests requiring OpenAI and MNEMOS services",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"]
